<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOMO AI Logo Animation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f6f3;
      font-family: Arial, sans-serif;
    }

    .logo-video-wrap {
      width: min(90vw, 960px);
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      overflow: hidden;
      background: #f8f6f3;
      box-shadow: 0 24px 80px rgba(90, 52, 24, 0.12);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #f8f6f3;
    }
  </style>
</head>
<body>
  <div class="logo-video-wrap">
    <video autoplay muted loop playsinline controls>
      <source src="momo_logo_animation_source.mp4" type="video/mp4" />
      你的浏览器不支持 HTML5 视频播放。
    </video>
  </div>
</body>
</html>
