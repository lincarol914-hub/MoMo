name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via the OIDC deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only run one Pages deployment at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Tells vite.config.ts to use the /MoMo/ base path.
          GITHUB_PAGES: "true"
          # Public Supabase config. Set these as repo Variables/Secrets to
          # enable the Cloud-backed features; otherwise the UI falls back to
          # mock data. (Settings > Secrets and variables > Actions)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://hfwhwmkhkvlxkgkrvrpj.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PRICING_API_URL: ${{ vars.VITE_PRICING_API_URL }}

      - name: SPA fallback (deep links / refresh)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
